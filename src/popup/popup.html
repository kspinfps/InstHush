<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InstHush</title>
  <link rel="stylesheet" href="popup.css">
  <script src="../vendor/gsap.min.js" defer></script>
  <script src="../lib/themes.js" defer></script>
  <script src="../lib/settings-schema.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <header class="header">
    <svg class="brand-mark" width="32" height="32" viewBox="0 0 16 16" aria-hidden="true">
      <path class="logo-shell" pathLength="100" d="M2.5 14.5V7a5.5 5.5 0 0 1 11 0v7.5l-2.5-1-3 1-3-1Z"/>
      <path class="logo-play" d="m7 5 4 3-4 3Z"/>
    </svg>
    <div class="identity"><h1 data-i18n="popupTitle"></h1><p id="brand-status" class="caption" role="status" data-active="false"><span class="status-on" data-i18n="popupGhostOn" aria-hidden="true"></span><span class="status-off" data-i18n="popupGhostOff"></span></p></div>
    <span id="sync-pill" class="local-badge sync-pill" hidden><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 6.5A5 5 0 0 0 3.6 5M3 9.5a5 5 0 0 0 9.4 1.5"/><path d="M3.25 2.5v2.75H6M12.75 13.5v-2.75H10"/></svg><span data-i18n="optSyncActive"></span></span>
    <span id="local-badge" class="local-badge"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span data-i18n="popupLocalChip"></span></span>
  </header>
  <main>
    <section class="ghost-card entrance" aria-labelledby="ghost-heading" data-cloaked="false">
      <div class="ghost-heading">
        <h2 id="ghost-heading" class="ghost-title">
          <svg class="emblem" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path class="emblem-fill" fill="currentColor" stroke="none" d="M3.5 13.5V7a4.5 4.5 0 0 1 9 0v6.5l-2.25-1.25L8 13.5l-2.25-1.25Z"/>
            <path d="M3.5 13.5V7a4.5 4.5 0 0 1 9 0v6.5l-2.25-1.25L8 13.5l-2.25-1.25Z"/>
            <g class="ghost-eyes"><circle cx="6.5" cy="6.75" r="0.85" fill="currentColor" stroke="none"/><circle cx="9.5" cy="6.75" r="0.85" fill="currentColor" stroke="none"/></g>
          </svg>
          <span data-i18n="popupGhostMode"></span>
        </h2>
        <button id="ghost-master" type="button" aria-describedby="ghost-master-desc" disabled></button>
        <span id="ghost-master-desc" class="sr-only" data-i18n="setGhostModeDesc"></span>
      </div>
      <div class="ghost-controls">
        <button class="setting ghost-setting" type="button" role="switch" aria-checked="true" aria-labelledby="story-label" aria-describedby="story-desc" data-setting="ghostStory" disabled>
          <span class="setting-top">
            <span class="setting-lead">
              <svg class="emblem" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path class="emblem-fill" fill="currentColor" stroke="none" d="M2.25 13.5V7.25a3.75 3.75 0 0 1 7.5 0v6.25l-1.88-1.1L6 13.5l-1.87-1.1Z"/>
                <path d="M2.25 13.5V7.25a3.75 3.75 0 0 1 7.5 0v6.25l-1.88-1.1L6 13.5l-1.87-1.1Z"/>
                <g class="ghost-eyes"><circle cx="4.75" cy="7" r="0.75" fill="currentColor" stroke="none"/><circle cx="7.25" cy="7" r="0.75" fill="currentColor" stroke="none"/></g>
                <path d="M11.5 2.25a2.5 2.5 0 1 1-1.77 4.27"/>
              </svg>
              <span id="story-label" class="setting-label" data-i18n="popupGhostStory"></span>
            </span>
            <span class="switch" aria-hidden="true"></span>
          </span>
          <span class="desc-line"><span id="story-desc" class="description" data-i18n="popupGhostStoryShort"></span><span class="info-btn" role="button" tabindex="0" data-tip="tipGhostStory" data-label-for="popupGhostStory">
                <svg class="info-glyph" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 7.25v3.5"/><circle cx="8" cy="4.75" r="0.75" fill="currentColor" stroke="none"/></svg>
              </span></span>
        </button>
        <button class="setting ghost-setting" type="button" role="switch" aria-checked="true" aria-labelledby="dm-label" aria-describedby="dm-desc" data-setting="ghostDm" disabled>
          <span class="setting-top">
            <span class="setting-lead">
              <svg class="emblem" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path class="emblem-fill" fill="currentColor" stroke="none" d="M2.25 13.5V7.5a3.5 3.5 0 0 1 7 0v6l-1.75-1L5.75 13.5 4 12.5Z"/>
                <path d="M2.25 13.5V7.5a3.5 3.5 0 0 1 7 0v6l-1.75-1L5.75 13.5 4 12.5Z"/>
                <g class="ghost-eyes"><circle cx="4.6" cy="7.25" r="0.7" fill="currentColor" stroke="none"/><circle cx="6.9" cy="7.25" r="0.7" fill="currentColor" stroke="none"/></g>
                <path d="M9.5 2.25h3.25c.55 0 1 .45 1 1v2c0 .55-.45 1-1 1H11.2L9.75 7.5V6.25H9.5c-.55 0-1-.45-1-1v-2c0-.55.45-1 1-1Z"/>
              </svg>
              <span id="dm-label" class="setting-label" data-i18n="popupGhostDm"></span>
            </span>
            <span class="switch" aria-hidden="true"></span>
          </span>
          <span class="desc-line"><span id="dm-desc" class="description" data-i18n="popupGhostDmShort"></span><span class="info-btn" role="button" tabindex="0" data-tip="tipGhostDm" data-label-for="popupGhostDm">
                <svg class="info-glyph" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 7.25v3.5"/><circle cx="8" cy="4.75" r="0.75" fill="currentColor" stroke="none"/></svg>
              </span></span>
        </button>
        <button class="setting ghost-setting" type="button" role="switch" aria-checked="false" aria-labelledby="typing-label" aria-describedby="typing-desc" data-ui-setting="ghostTyping" disabled>
          <span class="setting-top">
            <span class="setting-lead">
              <svg class="emblem" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path class="emblem-fill" fill="currentColor" stroke="none" d="M2.25 13.5V7.5a3.5 3.5 0 0 1 7 0v6l-1.75-1L5.75 13.5 4 12.5Z"/>
                <path d="M2.25 13.5V7.5a3.5 3.5 0 0 1 7 0v6l-1.75-1L5.75 13.5 4 12.5Z"/>
                <g class="ghost-eyes"><circle cx="4.6" cy="7.25" r="0.7" fill="currentColor" stroke="none"/><circle cx="6.9" cy="7.25" r="0.7" fill="currentColor" stroke="none"/></g>
                <path d="M9.5 2.25h3.25c.55 0 1 .45 1 1v2c0 .55-.45 1-1 1H11.2L9.75 7.5V6.25H9.5c-.55 0-1-.45-1-1v-2c0-.55.45-1 1-1Z"/>
              </svg>
              <span id="typing-label" class="setting-label" data-i18n="popupGhostTyping"></span>
            </span>
            <span class="switch" aria-hidden="true"></span>
          </span>
          <span class="desc-line"><span id="typing-desc" class="description" data-i18n="popupGhostTypingDesc"></span><span class="info-btn" role="button" tabindex="0" data-tip="tipGhostTyping" data-label-for="popupGhostTyping">
                <svg class="info-glyph" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 7.25v3.5"/><circle cx="8" cy="4.75" r="0.75" fill="currentColor" stroke="none"/></svg>
              </span></span>
        </button>
      </div>
    </section>
    <section class="settings entrance" aria-labelledby="settings-heading">
      <h2 id="settings-heading" class="sr-only" data-i18n="popupSettings"></h2>
      <!-- Quick switches by category, built from the settings catalogue (surfaces: popup) by popup.js. -->
      <div id="quick-groups"></div>
      <div class="setting compact-setting theme-setting">
        <span class="setting-lead">
          <svg class="emblem" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="8" cy="8" r="5.75"/><path d="M8 2.25a5.75 5.75 0 0 1 0 11.5Z" fill="currentColor" stroke="none"/>
          </svg>
          <span id="theme-label" class="setting-label" data-i18n="popupTheme"></span>
          <span class="info-btn" role="button" tabindex="0" data-tip="tipTheme" data-label-for="popupTheme">
            <svg class="info-glyph" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 7.25v3.5"/><circle cx="8" cy="4.75" r="0.75" fill="currentColor" stroke="none"/></svg>
          </span>
        </span>
        <div class="swatches" role="radiogroup" aria-labelledby="theme-label">
          <button class="swatch" type="button" role="radio" aria-checked="false" data-theme="green" data-i18n-label="themeGreen" style="--swatch-color:#246346" disabled></button>
          <button class="swatch" type="button" role="radio" aria-checked="true" data-theme="black" data-i18n-label="themeBlack" style="--swatch-color:#181B1E" disabled></button>
          <button class="swatch" type="button" role="radio" aria-checked="false" data-theme="white" data-i18n-label="themeWhite" style="--swatch-color:#F5F6F7" disabled></button>
          <button class="swatch" type="button" role="radio" aria-checked="false" data-theme="pink" data-i18n-label="themePink" style="--swatch-color:#C84B7C" disabled></button>
          <button class="swatch" type="button" role="radio" aria-checked="false" data-theme="purple" data-i18n-label="themePurple" style="--swatch-color:#734BB8" disabled></button>
          <button class="swatch" type="button" role="radio" aria-checked="false" data-theme="ocean" data-i18n-label="themeOcean" style="--swatch-color:#1F7A94" disabled></button>
        </div>
      </div>
    </section>
    <p id="storage-message" class="storage-message" role="status" aria-live="polite"></p>
    <section class="activity entrance" aria-labelledby="activity-heading">
      <div class="section-heading"><h2 id="activity-heading" data-i18n="popupActivity"></h2><span class="caption" data-i18n="popupLastDay"></span></div>
      <p id="stats-empty" class="note" data-i18n="popupStatsEmpty"></p>
      <div class="stats" hidden>
        <div class="stat"><output data-count="ads" aria-labelledby="ads-count-label" aria-live="off">0</output><span id="ads-count-label" class="stat-label" data-i18n="popupAdsBlocked"></span><span class="filter-status" data-status="ads"><span></span></span></div>
        <div class="stat"><output data-count="story" aria-labelledby="story-count-label" aria-live="off">0</output><span id="story-count-label" class="stat-label" data-i18n="popupStoriesHidden"></span><span class="filter-status" data-status="story"><span></span></span></div>
        <div class="stat"><output data-count="dm" aria-labelledby="dm-count-label" aria-live="off">0</output><span id="dm-count-label" class="stat-label" data-i18n="popupDmsHidden"></span><span class="filter-status" data-status="dm"><span></span></span></div>
      </div>
      <p id="leak-note" class="note leak-note" role="status" hidden data-i18n="popupLeak"></p>
    </section>
    <button id="all-settings" class="all-settings entrance" type="button"><span data-i18n="popupAllSettings"></span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
    <footer class="credit"><a class="signature" href="https://github.com/kspinfps" target="_blank" rel="noopener"><img src="../../assets/kspin.png" width="20" height="20" alt=""><span data-i18n="creditAuthor"></span></a></footer>
    <div id="iy-popup-tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>
  </main>
</body>
</html>
